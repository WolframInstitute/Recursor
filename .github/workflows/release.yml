name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish with PacletPage and release after CI.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: recursor-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Require a verified release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.ci.outputs.ready }}
      tag: ${{ steps.ci.outputs.tag }}
      commit: ${{ steps.ci.outputs.commit }}
      version: ${{ steps.ci.outputs.version }}
      run: ${{ steps.ci.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag, version and completed CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo '::error::Dispatch releases from main.'
            exit 1
          fi
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Use an existing vX.Y.Z tag.'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          version=$(git show "$commit:Recursor/PacletInfo.wl" | sed -n 's/^[[:space:]]*"Version" -> "\([^"]*\)",/\1/p')
          run=$(gh run list --workflow ci.yml --branch main --commit "$commit" --status success \
            --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId')
          git merge-base --is-ancestor "$commit" origin/main || { echo '::error::The tag must point to a commit on main.'; exit 1; }
          test "$TAG" = "v$version" || { echo '::error::The tag must match PacletInfo.wl.'; exit 1; }
          git cat-file -e "$commit:docs/releases/$version.md" || { echo '::error::The tagged commit needs matching release notes.'; exit 1; }
          [[ "$run" =~ ^[0-9]+$ ]] || { echo '::error::Complete CI on main for this exact commit before releasing.'; exit 1; }
          {
            echo 'ready=true'
            echo "tag=$TAG"
            echo "commit=$commit"
            echo "version=$version"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish with PacletPage
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    container:
      image: wolframresearch/wolframengine:15.0@sha256:3ac08d6aaa33e6dccdda38d14cf8a7e5c22cc84d037a1a7562900914a487ef65
      options: --user root --init
    env:
      QT_QPA_PLATFORM: offscreen
    timeout-minutes: 90
    steps:
      - name: Install Linux container tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make python3 ca-certificates curl tar xz-utils unzip zstd
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-recursor
        with:
          documentation: 'true'
          entitlement: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Recursor-verified
          path: dist
          run-id: ${{ needs.verify.outputs.run }}
          github-token: ${{ github.token }}

      - name: Verify provenance and checksums
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_ID: ${{ needs.verify.outputs.run }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("build.json").read_text())
          assert (manifest["commit"], manifest["version"], manifest["run_id"]) == tuple(os.environ[k] for k in ("COMMIT", "VERSION", "RUN_ID")), "CI provenance mismatch"
          expected = {f"WolframInstitute__Recursor-{os.environ['VERSION']}.paclet", "pacletpage-build.tar.gz"}
          assert set(manifest["files"]) == expected, "Unexpected release files"
          for name, digest in manifest["files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY

      - name: Restore the verified PacletPage build
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tarfile
          from pathlib import Path
          manifest = json.loads(Path("dist/build.json").read_text())
          assert manifest["commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "Checkout differs from release"
          for name, digest in manifest["files"].items():
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest, name
          with tarfile.open("dist/pacletpage-build.tar.gz") as archive:
              archive.extractall("Recursor", filter="data")
          PY

      - name: Publish and check the cloud resource and documentation
        env:
          WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
          WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
        run: |
          if [ -z "$WOLFRAM_CLOUD_USER" ] || [ -z "$WOLFRAM_CLOUD_PASSWORD" ]; then
            echo '::error::Configure WOLFRAM_CLOUD_USER and WOLFRAM_CLOUD_PASSWORD as repository secrets.'
            exit 1
          fi
          # Wolfram reads these credentials from its environment, not shell expansion.
          # shellcheck disable=SC2016
          wolframscript -code '
            connected = Quiet[Check[CloudConnect[Environment["WOLFRAM_CLOUD_USER"], Environment["WOLFRAM_CLOUD_PASSWORD"]], $Failed]];
            If[connected === $Failed || ! TrueQ[$CloudConnected], Print["Cloud authentication failed."]; Exit[1]];
            WithCleanup[Block[{$ScriptCommandLine = {"scripts/docs.wls", "publish"}}, Get[FileNameJoin[{Directory[], "scripts", "docs.wls"}]]], CloudDisconnect[]];'

  release:
    name: Publish the verified GitHub assets
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Recursor-verified
          path: dist
          run-id: ${{ needs.verify.outputs.run }}
          github-token: ${{ github.token }}

      - name: Verify provenance and checksums
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_ID: ${{ needs.verify.outputs.run }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("build.json").read_text())
          assert (manifest["commit"], manifest["version"], manifest["run_id"]) == tuple(os.environ[k] for k in ("COMMIT", "VERSION", "RUN_ID")), "CI provenance mismatch"
          expected = {f"WolframInstitute__Recursor-{os.environ['VERSION']}.paclet", "pacletpage-build.tar.gz"}
          assert set(manifest["files"]) == expected, "Unexpected release files"
          for name, digest in manifest["files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY

      - name: Create the release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT" || { echo '::error::The release tag points to another commit.'; exit 1; }
          cd dist
          assets=("WolframInstitute__Recursor-$VERSION.paclet" pacletpage-build.tar.gz build.json SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" \
              --notes-file "$GITHUB_WORKSPACE/docs/releases/$VERSION.md" --verify-tag
          fi
          mkdir -p "$RUNNER_TEMP/existing-release"
          for asset in "${assets[@]}"; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release download "$TAG" --pattern "$asset" --dir "$RUNNER_TEMP/existing-release" --clobber
              cmp "$asset" "$RUNNER_TEMP/existing-release/$asset" || { echo "::error::Refusing to replace changed release asset: $asset"; exit 1; }
            else
              gh release upload "$TAG" "$asset"
            fi
          done
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
